# Render Blueprint for the NestJS API (https://render.com/docs/blueprint-spec).
# Render -> New -> Blueprint -> pick this GitHub repo. It reads this file and asks you for the
# variables marked "sync: false" (your Supabase connection strings and your Vercel URL).
services:
  - type: web
    name: pavement-design-api
    runtime: node
    plan: free
    rootDir: backend
    # Install (incl. dev tools needed to compile), create the Prisma client, compile TypeScript.
    buildCommand: npm ci && npx prisma generate && npm run build
    # Apply pending database migrations, then start the server. (The free plan has no
    # pre-deploy step, so migrations run at start; with no new migrations this takes ~1 s.)
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL        # Supabase -> Connect -> Session pooler (port 5432)
        sync: false
      - key: DIRECT_URL          # same Session pooler string (Render cannot reach Supabase's IPv6-only direct host)
        sync: false
      - key: JWT_SECRET          # Render generates a long random value for you
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS        # e.g. https://your-app.vercel.app,https://your-app-*.vercel.app,http://localhost:3000
        sync: false
